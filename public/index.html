<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>URL Shortener</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><h1>Shorten a URL</h1><p>Create a shareable link to your destination.</p><form novalidate><label for="destination">Destination URL</label><input id="destination" name="destinationUrl" type="text" inputmode="url" autocomplete="url"><button type="submit">Shorten URL</button></form><div id="result" role="status" aria-live="polite"></div><p id="error" role="alert" hidden></p></main></body></html>
